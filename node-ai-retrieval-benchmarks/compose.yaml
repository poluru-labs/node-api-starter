services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
      SERVICE_NAME: node-ai-retrieval-benchmarks
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/health").then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
