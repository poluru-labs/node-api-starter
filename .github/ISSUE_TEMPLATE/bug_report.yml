name: Bug report
description: Report a defect in a service in this repository.
title: 'bug: '
body:
  - type: input
    id: service
    attributes:
      label: Service folder
      description: Which `node-ai-*` directory is affected?
      placeholder: node-ai-accessibility-auditor
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or git commit.
    validations:
      required: true
  - type: dropdown
    id: node
    attributes:
      label: Node.js version
      options:
        - '22'
        - '24'
        - '25'
        - Other
    validations:
      required: true
