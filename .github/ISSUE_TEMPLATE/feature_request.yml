name: Feature request
description: Suggest a change to a service in this repository.
title: 'feat: '
body:
  - type: input
    id: service
    attributes:
      label: Service folder
      description: Which `node-ai-*` directory should change? Use `repository` for the catalog itself.
      placeholder: node-ai-rag-evaluation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and how would you use it?
    validations:
      required: true
